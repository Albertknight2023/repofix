id: display-name-none
title: 用户显示名未处理空值
language: python
test_framework: pytest
issue: >-
  display_name 接收可选的用户名。传入 None 或只包含空白字符时应返回 Guest；
  其他输入应去掉首尾空白并保留原有大小写。当前传入 None 会报错。
repo_path: repo
public_test_command: python -m pytest tests -q
full_test_command: python -m pytest tests ../grader_tests -q
grader_test_path: grader_tests
timeout_seconds: 120
allowed_edit_paths:
  - src/
protected_paths:
  - tests/
  - ../grader_tests/
  - ../reference/
  - ../solution.patch
expected_initial_status: FAILED
expected_reference_status: PASSED
